services:
  express:
    build: ./express
    ports:
      - "3000:3000"
    environment:
      - API_KEY=${API_KEY}
      - PORT=${PORT}
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - express
  react-frontend:
    build: ./react-frontend
    ports:
      - "4000:4000"
    environment:
      - REACT_APP_API_URL=https://express.api.local
      - PORT=4000
